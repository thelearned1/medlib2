[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "medlib"
version = "0.1.0"
description = "Manage, tag and dedupe media files in a .medlib repository"
requires-python = ">=3.9"
dependencies = ["click>=8.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
medlib = "medlib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
